<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — Friendly Hours</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e0f2fe 50%, #f0f9ff 100%);
      color: #0f172a;
    }
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 480px;
      box-shadow: 0 25px 50px -12px rgba(14, 165, 233, 0.15),
                  0 8px 16px -8px rgba(0, 0, 0, 0.08);
      animation: fadeIn 0.8s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(90deg, #0284c7, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }
    p {
      color: #475569;
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }
    .nav a {
      display: inline-block;
      padding: 0.6rem 1.25rem;
      background: #0ea5e9;
      color: white;
      text-decoration: none;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
      transition: background 0.2s, transform 0.15s;
    }
    .nav a:hover {
      background: #0284c7;
      transform: translateY(-1px);
    }
    footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>About This Site</h1>
    <p>
      This is a second page deployed through the Mach one-time endpoint.<br><br>
      Light mode, multi-page, and still ridiculously simple to ship.
    </p>
    <div class="nav">
      <a href="index.html">← Back Home</a>
    </div>
    <footer>
      friendlyhours.getmach.cloud
    </footer>
  </div>
</body>
</html>
